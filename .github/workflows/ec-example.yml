---
name: ec-example
on:
  # SEE: https://github.com/actions/checkout/issues/15
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/ec-example.yml'
      - '.github/actions/**'
      - '.*'
      - 'Makefile'
      - 'package.json'
      - 'mise.toml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'packages/ec-example/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/ec-example.yml'
      - '.github/actions/**'
      - '.*'
      - 'Makefile'
      - 'package.json'
      - 'mise.toml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'packages/ec-example/**'
      - 'packages/libs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKSPACE_NAME: 'ec-example'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: mise run //${{ env.WORKSPACE_NAME }}:lint
      - name: pnpm build
        run: mise run //${{ env.WORKSPACE_NAME }}:build
      - name: Start test database
        run: mise run //${{ env.WORKSPACE_NAME }}:test:db:up
      - name: unit test
        run: mise run //${{ env.WORKSPACE_NAME }}:test
      - name: Push test database schema
        run: mise run //${{ env.WORKSPACE_NAME }}:test:db:push
      - name: db test
        run: mise run //${{ env.WORKSPACE_NAME }}:test:db
