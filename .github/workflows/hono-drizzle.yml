---
name: hono-drizzle
on:
  # SEE: https://github.com/actions/checkout/issues/15
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/hono-drizzle.yml'
      - '.github/actions/**'
      - '.*'
      - 'Makefile'
      - 'package.json'
      - 'mise.toml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'packages/hono-drizzle/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/hono-drizzle.yml'
      - '.github/actions/**'
      - '.*'
      - 'Makefile'
      - 'package.json'
      - 'mise.toml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'packages/hono-drizzle/**'
      - 'packages/libs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKSPACE_NAME: 'hono-drizzle'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: mise run //${{ env.WORKSPACE_NAME }}:lint
      - name: pnpm build
        run: mise run //${{ env.WORKSPACE_NAME }}:build
      - name: Start Docker Compose
        run: docker compose up -d
        working-directory: ./packages/${{ env.WORKSPACE_NAME }}
      - name: unit test
        run: mise run //${{ env.WORKSPACE_NAME }}:test
      - name: Migrate database
        run: mise run //${{ env.WORKSPACE_NAME }}:test:db:push
      - name: db test
        run: mise run //${{ env.WORKSPACE_NAME }}:test:db
