---
name: build
on:
  workflow_call:
    inputs:
      workspace-name:
        type: string
        required: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: mise run //${{ inputs.workspace-name }}:lint
      - name: pnpm build
        run: mise run //${{ inputs.workspace-name }}:build
      - name: pnpm test
        run: mise run //${{ inputs.workspace-name }}:test
