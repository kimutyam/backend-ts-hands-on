---
name: build
on:
  workflow_call:
    inputs:
      workspace-name:
        type: string
        required: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm lint
        run: pnpm --filter ${{ inputs.workspace-name }} lint
      - name: pnpm build
        run: pnpm --filter ${{ inputs.workspace-name }} build
      - name: pnpm test
        run: pnpm --filter ${{ inputs.workspace-name }} test
