[tasks]
lint = "pnpm lint"
format = "pnpm format"
build = "pnpm build"
test = "pnpm test --run"
"test:watch" = "pnpm test"
"test:cov" = "pnpm test:cov --run"
"db:up" = "docker compose up -d app_db"
"db:push" = "pnpm db:push"
"db:down" = "docker compose down"
"db:clean" = "docker compose down --rmi all --volumes --remove-orphans"
"test:db" = "pnpm test:db --run"
"test:db:up" = "docker compose up -d test_db"
"test:db:push" = "pnpm test:db:push"
"start" = "pnpm start:shopping"
